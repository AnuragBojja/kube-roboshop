apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq
  namespace: roboshop-dev
  labels:
    project: roboshop
    service: rabbitmq
    tier: database
data:
  RABBITMQ_DEFAULT_USER: "roboshop"
  RABBITMQ_DEFAULT_PASS: "roboshop123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: roboshop-dev
  labels:
    project: roboshop
    service: rabbitmq
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      service: rabbitmq
      tier: database
      env: dev
  template:
    metadata:
      labels:
        service: rabbitmq
        tier: database
        env: dev
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
              name: rabbitmq

          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 30
            failureThreshold: 2
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 30
            failureThreshold: 2
            periodSeconds: 5

---

apiVersion: v1 
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop-dev
  labels:
    project: roboshop
    service: rabbitmq
    tier: database
spec:
  selector:
    service: rabbitmq
    tier: database
    env: dev
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672