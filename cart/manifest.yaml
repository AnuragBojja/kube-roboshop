apiVersion: v1
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop-dev
data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGUE_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart 
  namespace: roboshop-dev
  labels:
    project: roboshop
    service: cart
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      service: cart
      tier: backend
      env: dev
  template:
    metadata:
      labels:
        service: cart
        tier: backend
        env: dev
    spec:
      enableServiceLinks: false
      containers:
        - name: cart
          image: anuragbojja/cart:v1
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: cart

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            failureThreshold: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            failureThreshold: 1
            periodSeconds: 5

---
apiVersion: v1 
kind: Service
metadata:
  name: cart
  namespace: roboshop-dev
spec:
  selector:
    service: cart
    tier: backend
    env: dev
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080