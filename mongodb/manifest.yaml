apiVersion: apps/v1
kind: Deployment 
metadata:
  name: mongodb
  namespace: roboshop-dev
  labels: 
    project: roboshop
    service: mongodb
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      service: mongodb
      tier: database
      env: dev
  template:
    metadata:
      labels:
        service: mongodb
        tier: database
        env: dev
    spec:
      containers:
      - name: mongodb
        image: anuragbojja/mongodb:v1
        imagePullPolicy: Always
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 15
          failureThreshold: 1
          periodSeconds: 5
          
        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 15
          failureThreshold: 3
          periodSeconds: 10

---

apiVersion: v1 
kind: Service
metadata:
  name: mongodb
  namespace: roboshop-dev
spec:
  selector:
    service: mongodb
    tier: database
    env: dev
  port:
  - protocol: TCP
    port: 27017
    targetPort: 27017