apiVersion: v1 
kind: ConfigMap
metadata:
  name: payment
  namespace: roboshop-dev
  labels:
    project: roboshop
    service: payment
    tier: backend
data:
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
  AMQP_USER: "roboshop"
  AMQP_PASS: "roboshop123"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: roboshop-dev
  labels:
    project: roboshop
    service: payment
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      service: payment
      tier: backend
      env: dev
  template:
    metadata:
      labels:
        service: payment
        tier: backend
        env: dev
    spec:
      containers:
        - name: payment
          image: anuragbojja/payment:v1
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: payment

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            failureThreshold: 2
            periodSeconds: 5
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            failureThreshold: 2
            periodSeconds: 5
---
apiVersion: v1 
kind: Service
metadata:
  name: payment
  namespace: roboshop-dev
  labels:
    project: roboshop
    service: payment
    tier: backend
spec:
  selector:
    service: payment
    tier: backend
    env: dev
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
