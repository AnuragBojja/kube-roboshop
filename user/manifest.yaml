apiVersion: v1 
kind: ConfigMap
metadata:
  name: user
  namespace: roboshop-dev
data:
REDIS_URL: 'redis:redis:6379'
MONGO_URL: "mongodb:mongodb:27017/users"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: roboshop-dev
  labels:
    project: roboshop
    service: user
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      service: user
      tier: backend
      env: dev
  template:
    metadata:
      labels:
        service: user
        tier: backend
        env: dev
    spec:
      containers:
        - name: user
          image: anuragbojja/user:v1
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: user
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            failureThreshold: 1
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            failureThreshold: 1
            periodSeconds: 5
---
apiVersion: v1 
kind: Service
metadata:
  name: user
  namespace: roboshop-dev
spec:
  selector:
    service: user
    tier: backend
    env: dev
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080