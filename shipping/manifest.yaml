apiVersion: v1 
kind: ConfigMap
metadata:
  name: shipping
  namespace: roboshop-dev
  labels:
    project: roboshop
    service: shipping
    tier: backend
data:
  CART_ENDPOINT: "cart:8080"
  DB_HOST: "mysql"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: roboshop-dev
  labels:
    project: roboshop
    service: shipping
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      service: shipping
      tier: backend
      env: dev
  template:
    metadata:
      labels:
        service: shipping
        tier: backend
        env: dev
    spec:
      containers:
        - name: shipping
          image: anuragbojja/shipping:v1
          ports:
            - containerPort: 8080
          imagePullPolicy: Always

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            failureThreshold: 1
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            failureThreshold: 1
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: roboshop-dev
  labels:
    project: roboshop
    service: shipping
    tier: backend
spec:
  selector:
    service: shipping
    tier: backend
    env: dev
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080