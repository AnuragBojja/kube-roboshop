# ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: roboshop-dev
  labels:
    project: roboshop
    service: frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      service: frontend
      tier: frontend
      env: dev
  template:
    metadata:
      labels:
        service: frontend
        tier: frontend
        env: dev
    spec:
      containers:
        - name: frontend
          image: anuragbojja/frontend:v1
          ports:
            - containerPort: 80
          imagePullPolicy: Always

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            failureThreshold: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            failureThreshold: 2
            periodSeconds: 5

---
apiVersion: v1 
kind: Service
metadata:
  name: frontend
  namespace: roboshop-dev
  labels:
    project: roboshop
    service: frontend
    tier: frontend
spec:
  type: LoadBalancer
  selector:
    service: frontend
    tier: frontend
    env: dev
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30007